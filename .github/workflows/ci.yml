name: Crypto Pipeline CI

on:
  push:
    branches:

  pull_request:
    branches:
      - main
      - dev

jobs:
  dbt-ci:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: .
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/crypto_transform/gcp-key.json

    defaults:
      run:
        working-directory: ./crypto_transform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install dbt-bigquery
          pip install -r ../requirements.txt

      - name: Install dbt packages
        run: dbt deps

      - name: Write GCP service account key
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$GCP_SERVICE_ACCOUNT_KEY" ]; then
            echo "Missing required secret: GCP_SERVICE_ACCOUNT_KEY"
            exit 1
          fi
          printf '%s' "$GCP_SERVICE_ACCOUNT_KEY" > gcp-key.json

      - name: Validate dbt project
        run: dbt parse --profiles-dir .

      - name: Run dbt tests
        run: dbt test --profiles-dir .
