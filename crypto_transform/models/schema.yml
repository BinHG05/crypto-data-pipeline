version: 2

sources:
  - name: crypto_raw
    database: "{{ env_var('GCP_PROJECT_ID', 'snappy-monolith-481115-e5') }}"
    schema: "{{ env_var('BQ_RAW_DATASET', 'crypto_dataset') }}"
    tables:
      - name: coingecko_prices
        columns:
          - name: symbol
            tests:
              - not_null
          - name: price
            tests:
              - not_null
      - name: reddit_posts
        columns:
          - name: id
            tests:
              - not_null

models:
  - name: stg_coingecko
    description: Standardized CoinGecko pricing records.
    columns:
      - name: coin_id
        tests:
          - not_null
      - name: price_usd
        tests:
          - not_null
      - name: recorded_at
        tests:
          - not_null

  - name: stg_reddit
    description: Standardized Reddit post records for crypto discussions.
    columns:
      - name: post_id
        tests:
          - not_null
          - unique
      - name: report_date
        tests:
          - not_null

  - name: fct_crypto_daily
    description: Daily mart combining pricing and Reddit engagement metrics.
    columns:
      - name: report_date
        tests:
          - not_null
      - name: coin_id
        tests:
          - not_null
