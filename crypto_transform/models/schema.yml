version: 2

sources:
  - name: crypto_raw
    database: "{{ env_var('GCP_PROJECT_ID', 'snappy-monolith-481115-e5') }}"
    schema: "{{ env_var('BQ_RAW_DATASET', 'crypto_dataset') }}"
    tables:
      - name: coingecko_prices
        columns:
          - name: symbol
            tests:
              - not_null
          - name: price
            tests:
              - not_null
      - name: reddit_posts
        columns:
          - name: id
            tests:
              - not_null
      - name: fear_greed_index
        columns:
          - name: timestamp
            tests:
              - not_null
          - name: value
            tests:
              - not_null
      - name: coingecko_trending
        columns:
          - name: coin_id
            tests:
              - not_null
          - name: timestamp
            tests:
              - not_null

models:
  - name: stg_coingecko
    description: Standardized CoinGecko pricing records.
    columns:
      - name: record_id
        tests:
          - not_null
          - unique
      - name: coin_id
        tests:
          - not_null
      - name: price_usd
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1000000
      - name: recorded_at
        tests:
          - not_null

  - name: stg_reddit
    description: Standardized Reddit post records for crypto discussions.
    columns:
      - name: record_id
        tests:
          - not_null
          - unique
      - name: post_id
        tests:
          - not_null
          - unique
      - name: report_date
        tests:
          - not_null

  - name: stg_fear_greed
    description: Standardized Fear & Greed Index records.
    columns:
      - name: record_id
        tests:
          - not_null
          - unique
      - name: report_date
        tests:
          - not_null
      - name: fng_value
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100

  - name: stg_trending_coins
    description: Standardized CoinGecko Trending Coin records.
    columns:
      - name: record_id
        tests:
          - not_null
          - unique
      - name: report_date
        tests:
          - not_null
      - name: coin_id
        tests:
          - not_null

  - name: dim_coin
    description: Unique crypto token dimension table.
    columns:
      - name: coin_id
        tests:
          - not_null
          - unique

  - name: dim_date
    description: Date dimension table for calendar reporting.
    columns:
      - name: date
        tests:
          - not_null
          - unique

  - name: fct_crypto_daily
    description: Daily mart combining pricing and Reddit engagement metrics.
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "avg_price >= 0"
    columns:
      - name: record_id
        tests:
          - not_null
          - unique
      - name: report_date
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date
      - name: coin_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_coin')
                field: coin_id
      - name: avg_price
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: reddit_posts
        tests:
          - not_null

  - name: fct_market_insights
    description: Daily insights combining prices, Reddit engagement, Fear & Greed index, trending status, and composite metrics.
    columns:
      - name: record_id
        tests:
          - not_null
          - unique
      - name: report_date
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date
      - name: coin_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_coin')
                field: coin_id
      - name: avg_price
        tests:
          - not_null
      - name: fng_value
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: sentiment_score
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100


